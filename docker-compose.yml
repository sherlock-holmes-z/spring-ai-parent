version: '3.8'

services:
  spring-ai-demo:
    image: crpi-dl21g96s4xe8z204.cn-shanghai.personal.cr.aliyuncs.com/xiguapi0901/spring_ai_demo:latest
    container_name: spring-ai-demo
    ports:
      - "8081:8081"
    environment:
      - ZHIPU_KEY=${ZHIPU_KEY:-your-zhipu-api-key}
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=70.0 -Xms512m -Xmx1024m
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
    volumes:
      - ./logs/demo:/app/logs
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
    networks:
      - spring-ai-network

networks:
  spring-ai-network:
    driver: bridge
