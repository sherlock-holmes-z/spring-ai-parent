name: Build and Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'spring-ai-demo/**'
      - 'spring-ai-common-core/**'
      - '.github/workflows/demo-build.yml'
      - 'pom.xml'
  pull_request:
    branches: [ main ]
    paths:
      - 'spring-ai-demo/**'
      - 'spring-ai-common-core/**'
      - '.github/workflows/demo-build.yml'
      - 'pom.xml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Login to Aliyun Registry
        run: |
          echo "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}" | docker login crpi-dl21g96s4xe8z204.cn-shanghai.personal.cr.aliyuncs.com \
            --username "${{ secrets.ALIYUN_REGISTRY_USERNAME }}" \
            --password-stdin

      - name: Build Docker image
        run: |
          docker build -t crpi-dl21g96s4xe8z204.cn-shanghai.personal.cr.aliyuncs.com/xiguapi0901/spring_ai_demo:latest \
                      -t crpi-dl21g96s4xe8z204.cn-shanghai.personal.cr.aliyuncs.com/xiguapi0901/spring_ai_demo:${{ github.sha }} \
                      -f spring-ai-demo/Dockerfile \
                      spring-ai-demo

      - name: Push Docker image
        run: |
          docker push crpi-dl21g96s4xe8z204.cn-shanghai.personal.cr.aliyuncs.com/xiguapi0901/spring_ai_demo:latest
          docker push crpi-dl21g96s4xe8z204.cn-shanghai.personal.cr.aliyuncs.com/xiguapi0901/spring_ai_demo:${{ github.sha }}
