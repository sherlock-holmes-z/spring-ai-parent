name: Build and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Login to Aliyun Registry
        run: |
          echo "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}" | docker login crpi-dl21g96s4xe8z204.cn-shanghai.personal.cr.aliyuncs.com \
            --username "${{ secrets.ALIYUN_REGISTRY_USERNAME }}" \
            --password-stdin

      - name: Build Docker image
        run: |
          cd spring-ai-demo
          docker build -t crpi-dl21g96s4xe8z204.cn-shanghai.personal.cr.aliyuncs.com/xiguapi0901/spring_ai:latest \
                      -t crpi-dl21g96s4xe8z204.cn-shanghai.personal.cr.aliyuncs.com/xiguapi0901/spring_ai:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push crpi-dl21g96s4xe8z204.cn-shanghai.personal.cr.aliyuncs.com/xiguapi0901/spring_ai:latest
          docker push crpi-dl21g96s4xe8z204.cn-shanghai.personal.cr.aliyuncs.com/xiguapi0901/spring_ai:${{ github.sha }}
